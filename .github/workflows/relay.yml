name: relay-vm-bundle
on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download VM bundle (best effort, log everything)
        run: |
          SHA=2a762adfc2eea13eca0d113a2e6452ff00ae3f62
          BASE="https://downloads.claude.ai/vms/linux/x64/${SHA}"
          : > dl.log
          for f in rootfs.vhdx.zst vmlinuz.zst initrd.zst; do
            echo "== ${f}" >> dl.log
            curl -v -fSL --retry 2 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -o "${f}" "${BASE}/${f}" >> dl.log 2>&1 \
              && echo "OK ${f}" >> dl.log \
              || echo "FAIL ${f} rc=$?" >> dl.log
          done
          ls -la >> dl.log 2>&1
          sha256sum *.zst >> dl.log 2>&1 || true
          cat dl.log

      - name: Upload debug log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: dl.log
          if-no-files-found: ignore

      - name: Upload zst artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zst-files
          path: |
            rootfs.vhdx.zst
            vmlinuz.zst
            initrd.zst
          if-no-files-found: ignore
          retention-days: 7

      - name: Create release with zst (if present)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls *.zst 2>/dev/null | while read f; do
            gh release create "vm-2a762adf" "$f" --repo "$GITHUB_REPOSITORY" \
              --title "VM bundle 2a762adf (x64)" --notes "relay" 2>/dev/null || \
              gh release upload "vm-2a762adf" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          true
